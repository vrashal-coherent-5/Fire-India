<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coherent Insights Vault — Platform Walkthrough</title>
<style>
:root{--bg:#e9edf3;--panel:#ffffff;--ink:#0f1b2d;--muted:#5b6678;--line:#d5dbe5;--accent:#2a9d8f;--accent-ink:#ffffff;--frame:#0d1626;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0a0f18;--panel:#131a26;--ink:#e6ebf2;--muted:#95a2b6;--line:#253044;--accent:#3cbcaa;--accent-ink:#06121a;--frame:#000000;color-scheme:dark}}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 16px 36px}
.top-title{width:min(100%,1280px);display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;gap:12px;flex-wrap:wrap}
.top-title h1{font-size:18px;font-weight:700}
.top-title p{font-size:13px;color:var(--muted)}
.player{width:min(100%,1280px)}
.frame{position:relative;width:100%;aspect-ratio:16/9;background:var(--frame);border-radius:12px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.25)}
.frame:fullscreen{border-radius:0;aspect-ratio:auto;width:100vw;height:100vh}
.controls{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.controls button,.controls select{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;height:36px;padding:0 14px;font:inherit;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.controls button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600;min-width:96px;justify-content:center}
.controls button:focus-visible,.controls select:focus-visible,.seg:focus-visible,.chip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.time{font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted);margin-left:auto}
.bar{display:flex;gap:4px;margin-top:12px}
.seg{position:relative;height:8px;background:var(--line);border-radius:4px;overflow:hidden;cursor:pointer;border:0;padding:0}
.seg i{position:absolute;inset:0 auto 0 0;background:var(--accent);width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font:inherit;font-size:12.5px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer}
.chip.on{color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}

/* ====== STAGE (simulated product, fixed light theme like the real platform) ====== */
.stage{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;overflow:hidden;background:#fff;color:#0f1b2d;font-family:Inter,"Segoe UI",system-ui,Roboto,Arial,sans-serif;
 --s-ink:#0f1b2d;--s-muted:#5d6878;--s-line:#e2e7ef;--s-bg:#f4f7fb;--s-navy:#10306a;--s-teal:#4fae9c;--s-blue:#2563eb}
.chrome{position:absolute;left:0;right:0;top:0;height:44px;background:#e6e9ee;display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid #d1d6de;z-index:40}
.dots{display:flex;gap:7px}.dots i{width:12px;height:12px;border-radius:50%;background:#ff5f57}.dots i:nth-child(2){background:#febc2e}.dots i:nth-child(3){background:#28c840}
.navbtn{color:#7a8392;font-size:16px;letter-spacing:6px}
.url{flex:1;height:28px;background:#fff;border-radius:14px;display:flex;align-items:center;gap:8px;padding:0 14px;font-size:13px;color:#3a4352}
.url svg{width:13px;height:13px;color:#2e8b57}
.loadbar{position:absolute;left:0;top:42px;height:3px;background:#4fae9c;width:0;z-index:41}
.viewport{position:absolute;top:44px;left:0;right:0;bottom:0;overflow:hidden;background:#fff}
.screen{position:absolute;inset:0;opacity:0;transition:opacity .5s;overflow:hidden;background:#fff;pointer-events:none}
.screen.on{opacity:1}
.scroller{position:absolute;left:0;right:0;top:0;will-change:transform}
.ico{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hov{box-shadow:0 0 0 3px rgba(79,174,156,.55)!important}

/* logo */
.logo .lw{font-family:Georgia,"Times New Roman",serif;font-size:var(--ls);color:#1d3b6e;letter-spacing:.02em;line-height:1;display:flex;align-items:center}
.logo .lo{display:inline-block;width:.78em;height:.78em;border-radius:50%;margin:0 .03em;background:radial-gradient(circle,#2e9fd8 28%,transparent 32%) 0 0/.2em .2em,radial-gradient(circle,#8cc63f 28%,transparent 32%) .1em .1em/.2em .2em;box-shadow:inset 0 0 0 1px rgba(29,59,110,.15)}
.logo .ls{font-size:calc(var(--ls)*.3);letter-spacing:.62em;color:#1d3b6e;margin-top:4px;white-space:nowrap}

/* grid background for dark heroes */
.gridbg{position:relative;overflow:hidden}
.gridbg::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:56px 56px;pointer-events:none}
.gridbg>*{position:relative}

/* ===== landing ===== */
.l-top{height:34px;display:flex;align-items:center;justify-content:space-between;padding:0 110px;font-size:12px;font-weight:600;letter-spacing:.04em;border-bottom:1px solid var(--s-line)}
.l-top span{margin-right:28px}
.l-tr{display:flex;align-items:center;gap:8px;color:#1d3b6e}
.soc{width:22px;height:22px;border:1px solid #c9d2e0;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;margin:0!important}
.l-nav{height:76px;display:flex;align-items:center;padding:0 110px;gap:22px;border-bottom:1px solid var(--s-line)}
.l-nav nav{display:flex;gap:20px;font-weight:700;font-size:15px;margin-left:36px;flex:1;white-space:nowrap}
.l-nav nav small{font-size:10px;margin-left:3px}
.l-search{display:flex;align-items:center;gap:6px;border:1px solid #d0d6df;border-radius:22px;padding:8px 14px;font-size:14px;color:#3b4554}
.btn-navy{background:#0f2a5c;color:#fff;font-weight:700;padding:11px 22px;border-radius:24px;font-size:15px}
.l-hero{background:linear-gradient(120deg,#16386b 0%,#102c62 45%,#14406f 100%);color:#fff;text-align:center;padding:52px 0 48px}
.l-hero::after{content:"";position:absolute;right:-120px;top:-80px;width:520px;height:420px;background:radial-gradient(closest-side,rgba(52,160,190,.35),transparent);pointer-events:none}
.pill{display:inline-flex;align-items:center;gap:10px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.07);border-radius:22px;padding:9px 20px;font-size:14px;font-weight:700;letter-spacing:.06em;color:#d7e2f2}
.pill .gd{width:9px;height:9px;border-radius:50%;background:#8cc63f;box-shadow:0 0 0 4px rgba(140,198,63,.25)}
.l-hero h1{font-family:Georgia,"Times New Roman",serif;font-weight:500;font-size:78px;margin:26px 0 8px;letter-spacing:-.01em}
.l-hero h1 .g{background:linear-gradient(90deg,#3cc0cb,#a4d45a);-webkit-background-clip:text;background-clip:text;color:transparent}
.l-hero h3{font-size:25px;font-weight:700}
.l-hero p{max-width:960px;margin:20px auto 0;font-size:18px;line-height:1.75;color:#c9d5e6}
.l-hero hr{border:0;border-top:1px solid rgba(255,255,255,.15);width:1110px;margin:34px auto 26px}
.l-stats{display:flex;justify-content:center;gap:52px;align-items:baseline}
.l-stats b{font-size:31px;font-weight:800;margin-right:10px}
.l-stats span{font-size:15.5px;color:#c9d5e6}
.l-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;padding:30px 160px 20px}
.lc{height:192px;border-radius:14px;background:#fff;box-shadow:0 10px 30px rgba(16,40,80,.1);border:1px solid #edf0f5;border-bottom:4px solid #1aa0a0;display:flex;align-items:center;gap:16px;padding:20px;position:relative}
.lc .ic{width:58px;height:58px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
.lc .ic .ico{width:26px;height:26px}
.lc b{display:block;font-size:20px;color:#10306a;line-height:1.2}
.lc span{font-size:14.5px;color:#5d6878;line-height:1.5;display:block;margin-top:4px}
.lc .go{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;margin-left:auto}
.lc.c1{background:linear-gradient(135deg,#123a73,#1d6aa8);border-bottom-color:#8cc63f;color:#fff}
.lc.c1 b{color:#fff}.lc.c1 span{color:#cfe0f2}
.l-how{text-align:center;padding:46px 160px 50px}
.lbl{font-size:14px;font-weight:800;letter-spacing:.2em;color:#2a9d8f}
.l-how h2{font-family:Georgia,"Times New Roman",serif;font-weight:500;font-size:50px;color:#10306a;margin:12px 0}
.l-how>p{font-size:18px;color:#5d6878}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:36px;text-align:left}
.step{border:1px solid #e3e8ef;border-radius:14px;padding:24px;background:#f8fafc}
.step em{font-style:normal;font-weight:800;color:#2a9d8f;font-size:14px}
.step b{display:block;font-size:19px;color:#10306a;margin:10px 0 8px}
.step p{font-size:14.5px;color:#5d6878;line-height:1.55}
.l-foot{background:#0f2a5c;color:#b9c7dc;padding:34px 160px;font-size:14px;display:flex;justify-content:space-between}

/* ===== hub ===== */
.h-head{height:92px;display:flex;align-items:center;padding:0 130px;border-bottom:1px solid var(--s-line)}
.h-head .r{margin-left:auto;display:flex;align-items:center;gap:20px;font-size:15px;color:#3b4554}
.live{display:flex;align-items:center;gap:8px;border:1px solid #dfe5ec;border-radius:22px;padding:8px 16px}
.live i{width:9px;height:9px;border-radius:50%;background:#22c55e}
.outbtn{border:1px solid #dfe5ec;border-radius:22px;padding:8px 16px;font-weight:600;color:#0f1b2d}
.h-hero{background:linear-gradient(115deg,#173a68 0%,#13305a 50%,#0d2142 100%);color:#fff;padding:56px 130px 120px;display:flex;gap:60px}
.h-hero .pill{font-size:13.5px;letter-spacing:.12em}
.h-hero h1{font-size:64px;line-height:1.08;font-weight:800;margin:26px 0 22px;letter-spacing:-.02em}
.h-hero p{font-size:19px;line-height:1.75;color:#c9d5e6;max-width:740px}
.h-stats{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-left:auto;align-self:flex-start;margin-top:22px}
.h-stats div{width:300px;height:128px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);border-radius:14px;padding:26px}
.h-stats b{font-size:40px;font-weight:800;display:block}
.h-stats span{font-size:15px;color:#cfdbea}
.h-band{margin:-74px 130px 0;padding:12px;background:#fff;border-radius:22px;box-shadow:0 12px 34px rgba(16,40,80,.12);position:relative}
.h-band>div{height:110px;border-radius:14px;background:linear-gradient(90deg,#e3a02c,#c96a1f);display:flex;align-items:center;gap:20px;padding:0 28px;color:#fff}
.h-band .ic{width:64px;height:64px;border-radius:12px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center}
.h-band .ic .ico{width:28px;height:28px}
.h-band b{font-size:21px;display:block}.h-band span{font-size:16px;opacity:.92}
.h-band em{margin-left:auto;font-style:normal;background:rgba(255,255,255,.25);border-radius:16px;padding:6px 14px;font-weight:700}
.h-sec{background:#f4f7fb;padding:60px 130px 70px}
.h-sec h2{font-size:33px;font-weight:800;color:#10233f}
.h-sec>p{font-size:17px;color:#5d6878;margin:10px 0 24px}
.h-search{width:450px;height:54px;border:1px solid #dfe5ec;background:#fff;border-radius:10px;display:flex;align-items:center;gap:12px;padding:0 18px;color:#6b7686;font-size:17px}
.h-search .q{color:#0f1b2d}
.h-search .q:empty::before{content:"Search markets…";color:#8a94a3}
.caret{width:2px;height:22px;background:#0f1b2d;animation:blink 1s steps(1) infinite;margin-left:-10px;opacity:0}
.h-search.focus{border-color:#c96a1f;box-shadow:0 0 0 3px rgba(201,106,31,.18)}
.h-search.focus .caret{opacity:1}
@keyframes blink{50%{visibility:hidden}}
.h-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:20px;margin-top:30px}
.hc{background:#fff;border:1px solid #e6ebf1;border-radius:16px;padding:26px;height:216px;display:flex;flex-direction:column}
.hc .t{display:flex;justify-content:space-between;align-items:center}
.hc .ic{width:58px;height:58px;border-radius:12px;background:#fdf0df;color:#c96a1f;display:flex;align-items:center;justify-content:center}
.hc .ic .ico{width:26px;height:26px}
.hc .n{font-weight:700;color:#9aa4b2;letter-spacing:.06em}
.hc b{font-size:20px;margin-top:22px;line-height:1.25;color:#10233f}
.hc span{font-size:14px;color:#7a8594;margin-top:6px}
.hc.hide{display:none}

/* ===== dashboard ===== */
.d-head{display:flex;align-items:center;padding:24px 22px 20px;background:#f4f7fb}
.d-head .tt{flex:1;text-align:center;padding-right:180px}
.d-head h1{font-size:30px;font-weight:800;color:#0b1220}
.d-head p{font-size:16.5px;color:#5d6878;margin-top:8px}
.d-kpis{display:none;grid-template-columns:repeat(4,1fr);gap:20px;padding:20px 30px;margin:0 8px 18px;border-top:1px solid #e3e8ef;border-bottom:1px solid #e3e8ef;background:#f4f7fb}
.d-kpis.on{display:grid}
.d-kpis .k{display:flex;align-items:center;gap:12px}
.d-kpis .k i{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.d-kpis small{font-size:12.5px;font-weight:700;letter-spacing:.04em;display:block}
.d-kpis b{font-size:21px}
.d-kpis em{display:block;font-style:normal;font-size:12px;color:#5d6878}
.d-kpis .kh{grid-column:1/-1;font-size:15px;padding-bottom:10px;border-bottom:1px solid #e3e8ef;margin-bottom:4px}
.d-tabs{margin:0 16px;background:#fff;border:1px solid #e3e8ef;border-radius:10px;padding:10px 16px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;box-shadow:0 2px 8px rgba(16,40,80,.05)}
.d-tabs>b{font-size:15px;margin-right:6px}
.d-tab{white-space:nowrap;display:flex;gap:8px;align-items:center;padding:9px 14px;border-radius:7px;font-size:15px;color:#1d2735;border:2px solid transparent;transition:background .3s,color .3s}
.d-tab.on{background:#4fae9c;color:#fff;border-color:#2f8a79}
.pane{display:none;padding-bottom:40px}
.pane.on{display:block;animation:fin .5s}
@keyframes fin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.d-country{margin:18px 16px 0;background:#fff;border:1px solid #e3e8ef;border-radius:10px;height:58px;display:flex;align-items:center;gap:10px;padding:0 16px;font-size:15.5px}
.d-country .p{padding:8px 15px;border-radius:7px}
.d-country .p.on{background:#4fae9c;color:#fff}
.d-panel{margin:18px 16px 0;background:#fff;border:1px solid #e3e8ef;border-radius:10px}
.d-ph{height:58px;display:flex;align-items:center;gap:8px;padding:0 18px;border-bottom:1px solid #e3e8ef}
.d-ph .sq{width:36px;height:36px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:#3b4554}
.d-ph .sq.on{background:#e3ecfb;color:#2563eb}
.d-sub{height:58px;display:flex;align-items:center;padding:0 30px;margin-left:30px;color:#2563eb;font-size:17px;border-bottom:2px solid #2563eb}
.d-sub2{height:58px;display:flex;align-items:center;padding:0 26px;font-size:17px;color:#0f1b2d;border-bottom:2px solid transparent}
.d-sub2.on{color:#2563eb;border-bottom-color:#2563eb}
.d-ins{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:17px}
.d-pad{padding:28px 30px 34px}
.d-pad h2{font-size:29px;font-weight:800;color:#10233f}
.mut{color:#5d6878;font-size:16.5px;margin-top:8px}
.bar-h{font-size:24px;font-weight:800;color:#10233f;border-left:6px solid #6ab04c;padding-left:16px;margin:28px 0 22px;border-radius:2px}
.seg-wrap{border:1px solid #e3e8ef;border-radius:14px;padding:26px 30px;background:#fbfcfe}
.sgg h4{font-size:19px;border-left:5px solid #6ab04c;padding-left:14px;margin:6px 0 16px;color:#10233f}
.sgl{border:1px solid #e3e8ef;border-radius:10px;background:#fff;padding:8px 20px;margin-bottom:26px}
.sgl div{padding:15px 0;font-size:17px}
.sgl em{font-style:normal;color:#6ab04c;font-weight:700;display:inline-block;width:76px}

/* market analysis */
.ma{display:grid;grid-template-columns:400px 1fr;gap:16px;margin:18px 16px 0}
.side{display:flex;flex-direction:column;gap:16px}
.box{background:#fff;border:1px solid #e3e8ef;border-radius:10px;padding:18px 20px}
.qf h5{font-size:15px;letter-spacing:.1em;display:flex;align-items:center;gap:6px;margin-bottom:12px}
.qf .g{display:grid;grid-template-columns:1fr 1fr;gap:14px 10px;font-size:15px}
.qf .g span{display:flex;align-items:center;gap:8px;color:#1d2735}
.qf .g .ico{color:#2563eb}
.fl{font-size:15px;color:#1d2735;margin:4px 0 10px;letter-spacing:.02em}
.tog{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:22px}
.tog span{height:38px;display:flex;align-items:center;justify-content:center;border-radius:5px;background:#eef1f5;font-size:15.5px}
.tog span.on{background:#2563eb;color:#fff}
.sel{height:42px;border:1px solid #cfd6df;border-radius:6px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:17px;margin-bottom:22px}
.geo{background:#eef4fd;border-radius:6px;padding:12px;font-size:15px;color:#2563eb}
.geo em{font-style:normal;display:inline-block;margin-top:8px;border:1px solid #c9d8f3;background:#fff;border-radius:4px;padding:4px 10px}
.chart-wrap{position:relative;padding:20px 24px 26px}
.chart-wrap h3{font-size:22px;margin-bottom:8px}
.tip{position:absolute;background:#0f1b2d;color:#fff;font-size:13.5px;border-radius:8px;padding:9px 12px;line-height:1.45;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.tip.on{opacity:1}
.legend{display:flex;gap:22px;justify-content:center;font-size:14px;color:#3b4554}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px}

/* tables */
.props{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:26px}
.prop{border:1px solid #e9edf2;border-radius:12px;padding:18px 22px;height:84px;color:#9aa4b2}
.prop.on{border:2px solid #4fae9c;color:#0f1b2d}
.prop .t{display:flex;justify-content:space-between;font-size:18px;font-weight:700}
.prop em{font-style:normal;font-size:12px;font-weight:700;border-radius:12px;padding:3px 10px;border:1px solid #e1e5f4;letter-spacing:.04em}
.prop.on em{background:#1a8f7a;color:#fff;border-color:#1a8f7a}
.prop .s{font-size:14.5px;margin-top:8px}
.prop.on .s{color:#2f7f70}
.prop.p3 em{color:#c084fc;background:#faf5ff}
.prop.p2 em{color:#8b93c9}
.incl{margin-top:24px;border:1px solid #cfe3f5;background:#f2f8fe;border-radius:10px;padding:16px 20px;font-size:17px;line-height:1.5}
.incl b{color:#10306a}
.db{margin-top:26px;border-radius:10px;overflow:hidden;border:1px solid #dfe5ec}
.dbh{background:#1b2a47;color:#fff;padding:24px 26px;display:flex;align-items:center}
.dbh b{font-size:20px;display:block}.dbh span{font-size:16px;color:#c7d2e2;display:block;margin-top:8px}
.dbh em{margin-left:auto;font-style:normal;background:#eef2f7;color:#1b2a47;font-weight:700;border-radius:16px;padding:7px 16px;font-size:14.5px;letter-spacing:.05em}
.tscroll{overflow:hidden;position:relative}
.tinner{will-change:transform}
table{border-collapse:collapse;font-size:16px}
th{text-align:left;font-size:14.5px;font-weight:700;padding:14px 16px;background:#e0effb;border-right:1px solid #fff;color:#0f1b2d;vertical-align:bottom}
td{padding:14px 16px;vertical-align:top;border-bottom:1px solid #edf0f4;line-height:1.55}
tr:nth-child(even) td{background:#f8fafc}
.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

/* ---------------- player ---------------- */
const TOTAL=CH.reduce((a,c)=>a+c.d,0);
const bar=$('#bar'),chips=$('#chips');
CH.forEach((c,i)=>{const b=document.createElement('button');b.className='seg';b.style.flex=c.d;b.title=c.n;b.setAttribute('aria-label','Jump to '+c.n);b.innerHTML='<i></i>';b.onclick=()=>playFrom(i);bar.appendChild(b);
 const ch=document.createElement('button');ch.className='chip';ch.textContent=c.n;ch.onclick=()=>playFrom(i);chips.appendChild(ch)});
const fmt=ms=>{const s=Math.floor(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function drawProgress(){const segs=bar.children;let el=0;for(let i=0;i<CH.length;i++){let f=i<curCh?1:i>curCh?0:Math.min(1,(clock-chStart)/CH[i].d);segs[i].firstChild.style.width=(f*100)+'%';if(i<curCh)el+=CH[i].d;else if(i===curCh)el+=f*CH[i].d}
 [...chips.children].forEach((c,i)=>c.classList.toggle('on',i===curCh));$('#time').textContent=fmt(el)+' / '+fmt(TOTAL)}
let ended=false;
async function playFrom(i){gen++;const ws=waiters;waiters=[];ws.forEach(w=>w.res());const my=gen;ended=false;
 document.querySelectorAll('.ov').forEach(o=>o.classList.remove('on'));clearHov();$('#tip').classList.remove('on');
 if(!playing){playing=true;updBtn()}
 for(let k=i;k<CH.length;k++){curCh=k;chStart=clock;clearHov();
  try{await CH[k].run();const rem=CH[k].d-(clock-chStart);if(rem>0)await sleep(rem)}catch(e){if(e instanceof Abort)return;console.error(e);return}
  if(my!==gen)return}
 ended=true;playing=false;updBtn();$('#play').textContent='↺ Replay'}
function updBtn(){$('#play').textContent=playing?'❚❚ Pause':'▶ Play'}
$('#play').onclick=()=>{if(ended){playFrom(0);return}playing=!playing;updBtn()};
$('#restart').onclick=()=>playFrom(0);
$('#prev').onclick=()=>playFrom(Math.max(0,curCh-1));
$('#next').onclick=()=>playFrom(Math.min(CH.length-1,curCh+1));
$('#speed').onchange=e=>speed=+e.target.value;
$('#fs').onclick=()=>{document.fullscreenElement?document.exitFullscreen():frame.requestFullscreen&&frame.requestFullscreen()};
document.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT')return;if(e.code==='Space'){e.preventDefault();$('#play').click()}else if(e.code==='ArrowRight')$('#next').click();else if(e.code==='ArrowLeft')$('#prev').click()});
setPD('Hardener Chemistry Breadth');drawMA(1);
window.step=async function(ms){frameNo++;clock+=ms;
 const rd=waiters.filter(w=>w.t<=clock&&w.f<frameNo);waiters=waiters.filter(w=>!(w.t<=clock&&w.f<frameNo));rd.forEach(w=>w.res());
 for(let k=0;k<3;k++)await new Promise(r=>setTimeout(r,0));
 for(const a of document.getAnimations()){if(!a._m){a._m=1;a.pause();a.currentTime=0}else{a.currentTime=(a.currentTime||0)+ms}}
 return ended};
window.startManual=function(){MANUAL=true;speed=1;playFrom(0);return clock};
const REC=location.hash==='#rec';if(REC){document.body.classList.add('rec');fit()}
requestAnimationFrame(tick);if(!REC)playFrom(0);
